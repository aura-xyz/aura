[package]
name = "aura"
version = "0.7.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: v0.7.0 的系统托盘（常驻后台、关闭按钮只隐藏到托盘）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
# reqwest 0.13 的默认 TLS 是 rustls + rustls-platform-verifier（Windows 平台验证器）。
# 它会做证书吊销检查（CRL/OCSP），而 GitHub 证书的吊销服务器在境内不可达，
# 于是**每个新建连接都要多等约 10 秒**才软失败。更新检查与下载各自新建一次
# 客户端，用户看到的就是「45 秒才找到新版本」「证书检测 60 秒超时」。
#
# 改用 native-tls（Windows 上即 schannel）：走系统证书库，吊销检查软失败，
# 建连秒级；顺带能识别企业代理装的根证书（rustls 的 webpki 根证书集不认）。
# 注意：Linux 上 native-tls 依赖 OpenSSL，本项目目前只支持 Windows 构建。
reqwest = { version = "0.13.5", features = ["stream", "json", "native-tls"] }
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
bytes = "1.12.1"
tokio = { version = "1.53.2", features = ["sync", "macros", "time", "rt", "rt-multi-thread", "process"] }
# cmd 输出解码：中文 Windows 的 cmd 默认按 GBK(936) 输出，UTF-8 解码会得到乱码
encoding_rs = "0.8"
tauri-plugin-dialog = "2.8.1"
regex = "1.10"
# v0.5.0：自动更新。Tauri v2 已内建包校验，无需额外 feature
# 关闭默认的 rustls-tls，改走 native-tls（schannel）——理由同上：
# rustls-platform-verifier 的吊销检查在境内不可达，会拖慢每一次更新检查与下载。
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
# v0.6.3：窗口位置/大小/最大化状态记忆。无边框窗口更需要它——
# 启动即强制最大化且不记位置，是「用起来像网页」的典型泄漏点
tauri-plugin-window-state = "2"
# 供 updater 在下载安装包时跟随系统代理
tauri-plugin-process = "2"
# v0.6.1 技能市场：解包注册表里的技能 zip（Tauri 已依赖同版本，无新增下载）
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
# 技能包完整性校验（清单里带 sha256）
sha2 = "0.10.9"

# Provider trait 的异步方法。async-trait 已在依赖树中（0.1.92），
# 声明为直接依赖不增加编译量。
async-trait = "0.1.92"
# 顺着 GitHub Contents API 取清单时，文件内容被 base64 包在 JSON 里。
# 0.22.1 已在 Tauri 的依赖树中，声明为直接依赖不会新增编译。
base64 = "0.22"
tauri-plugin-notification = "2.7.0"
# url：构造 updater 的下载地址（Update::download_url 是 url::Url）。
# 0.2.1 已在依赖树中（updater 插件带入），声明为直接依赖不增加编译量。
url = "2"

[features]
# 生产构建启用；tauri dev 由 CLI 以 --no-default-features 关闭以使用 devUrl
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

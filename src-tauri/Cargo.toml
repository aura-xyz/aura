[package]
name = "aura"
version = "0.6.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
reqwest = { version = "0.13.5", features = ["stream", "json"] }
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
bytes = "1.12.1"
tokio = { version = "1.53.2", features = ["sync", "macros", "time", "rt", "rt-multi-thread", "process"] }
# cmd 输出解码：中文 Windows 的 cmd 默认按 GBK(936) 输出，UTF-8 解码会得到乱码
encoding_rs = "0.8"
tauri-plugin-dialog = "2.8.1"
regex = "1.10"
# v0.5.0：自动更新。Tauri v2 已内建包校验，无需额外 feature
tauri-plugin-updater = "2"
# v0.6.3：窗口位置/大小/最大化状态记忆。无边框窗口更需要它——
# 启动即强制最大化且不记位置，是「用起来像网页」的典型泄漏点
tauri-plugin-window-state = "2"
# 供 updater 在下载安装包时跟随系统代理
tauri-plugin-process = "2"
# v0.6.1 技能市场：解包注册表里的技能 zip（Tauri 已依赖同版本，无新增下载）
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
# 技能包完整性校验（清单里带 sha256）
sha2 = "0.10.9"

# Provider trait 的异步方法。async-trait 已在依赖树中（0.1.92），
# 声明为直接依赖不增加编译量。
async-trait = "0.1.92"
# 顺着 GitHub Contents API 取清单时，文件内容被 base64 包在 JSON 里。
# 0.22.1 已在 Tauri 的依赖树中，声明为直接依赖不会新增编译。
base64 = "0.22"
tauri-plugin-notification = "2.7.0"

[features]
# 生产构建启用；tauri dev 由 CLI 以 --no-default-features 关闭以使用 devUrl
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
